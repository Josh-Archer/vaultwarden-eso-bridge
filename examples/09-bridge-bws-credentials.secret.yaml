apiVersion: v1
kind: Secret
metadata:
  name: eso-bridge-bws
  namespace: external-secrets
type: Opaque
stringData:
  # Machine account access token generated in Bitwarden Secrets Manager (BWS).
  # No master password, email, or interactive 2FA is required.
  BWS_ACCESS_TOKEN: "0.00000000-0000-0000-0000-000000000000:YourBwsMachineAccessTokenHere"
