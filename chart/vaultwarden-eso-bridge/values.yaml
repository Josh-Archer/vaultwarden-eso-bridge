replicaCount: 1

image:
  repository: ghcr.io/josh-archer/vaultwarden-eso-bridge
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  annotations: {}

exposure:
  # Keep internal-only by default. To expose externally, set this true and
  # explicitly change service.type to NodePort/LoadBalancer.
  allowExternalService: false

auth:
  # Authentication mode: "token" (static BRIDGE_TOKEN), "tokenReview" (Kubernetes SA tokens), or "dual" (both accepted).
  mode: token
  existingSecret: eso-bridge-auth
  tokenKey: token
  # Strict exact BRIDGE_TOKEN match by default. Set true only while migrating
  # mis-encoded secrets that rely on quote-strip or base64 bearer variants.
  legacyTokenVariants: false
  # Kubernetes ServiceAccount TokenReview authentication (zero shared secrets).
  tokenReview:
    enabled: false
    # Allowed ServiceAccount identities (full name, namespace:name, or namespace:*).
    allowedServiceAccounts:
      - "system:serviceaccount:external-secrets:external-secrets"
    # In-process cache TTL for validated SA tokens (seconds).
    cacheTtlSeconds: 300
    # Optional target audiences for TokenReview validation.
    audiences: []

# -- ServiceAccount configuration.
serviceAccount:
  create: true
  name: vaultwarden-eso-bridge
  annotations: {}

# -- RBAC permissions for Kubernetes TokenReview API.
rbac:
  create: true

# -- In-pod TLS / HTTPS termination.
tls:
  enabled: false
  existingSecret: ""
  certPath: /etc/tls/tls.crt
  keyPath: /etc/tls/tls.key
backend:
  mode: mock
  itemNameTemplate: "{namespace}/{secret}"
  vaultwarden:
    server: ""
    organizationId: ""
    folderName: "k8s-secrets"
  bwCli:
    enabled: false
    cliVersion: "2025.12.0"
    existingSecret: eso-bridge-bw
    serverKey: BW_SERVER
    emailKey: BW_EMAIL
    passwordKey: BW_PASSWORD
    sessionKey: ""
    # Optional in-process cache for hot secret item lookups (seconds).
    # 0 = disabled (default). Short TTLs (e.g. 15–60) reduce bw CLI load under
    # ESO reconcile storms but can serve stale secret values until expiry.
    itemCacheTtlSeconds: 0
    # Negative cache TTL for 404/not-found lookups (seconds).
    # Default 15s prevents hammering Vaultwarden when ExternalSecrets request
    # missing secrets during reconciliation loops. 0 disables negative caching.
    negativeCacheTtlSeconds: 15
    commandTimeoutSeconds: 120
    startupProbe:
      enabled: true
      periodSeconds: 10
      failureThreshold: 60
  # Bitwarden Secrets Manager (BWS) native machine account provider.
  bws:
    enabled: false
    existingSecret: eso-bridge-bws
    accessTokenKey: BWS_ACCESS_TOKEN
    serverUrl: ""
    projectId: ""
    itemCacheTtlSeconds: 120
    negativeCacheTtlSeconds: 15
    commandTimeoutSeconds: 60
  mockSecrets: {}

# -- Event-driven real-time secret sync over Vaultwarden WebSocket (/notifications/hub).
websocketSync:
  enabled: false
  url: ""
  reconnectIntervalSeconds: 5
  sslVerify: true

# Probe defaults. Liveness uses /healthz (process up). Readiness uses /readyz
# which fails for bw-cli when the Bitwarden session is invalid so the pod is
# removed from Service endpoints and ESO stops hammering a dead bridge.
# Leave initialDelaySeconds empty to keep mode-aware defaults (longer for bw-cli).
probes:
  readiness:
    initialDelaySeconds: null
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    initialDelaySeconds: null
    periodSeconds: 20
    failureThreshold: 3

resources: {}

networkPolicy:
  enabled: false
  # When true, allow same-namespace pods to reach the bridge.
  allowSameNamespace: true
  # Additional ingress peers. Each item may include namespaceSelector,
  # podSelector, and/or ipBlock.
  allowedPeers: []

# -- Prometheus Operator ServiceMonitor. Requires the /metrics endpoint
# exposed by bridge_server.py (added in Phase 1).
serviceMonitor:
  enabled: false
  # Additional labels for ServiceMonitor discovery (e.g. release: kube-prometheus-stack).
  labels: {}
  annotations: {}
  # Scrape interval. Prometheus Operator default is 30s.
  interval: 30s
  # scrapeTimeout: 10s
  # metricRelabelings: []
  # relabelings: []
  # namespaceSelector: {}

# -- Prometheus Operator PrometheusRule with default alerts.
prometheusRule:
  enabled: false
  labels: {}
  annotations: {}
  # Fire VaultwardenBridgeSessionDown after this duration of bw-cli session failure.
  sessionDownFor: 5m
  sessionDownSeverity: critical
  # Fire VaultwardenBridgeHighErrorRate when 5xx rate exceeds this fraction.
  highErrorRateThreshold: 0.1
  highErrorRateFor: 5m
  highErrorRateSeverity: warning
  # Additional custom rules appended to the group.
  additionalRules: []

# -- PodDisruptionBudget for rolling updates. Only useful when replicaCount > 1.
podDisruptionBudget:
  enabled: false
  # Set one of minAvailable or maxUnavailable. maxUnavailable default: 1.
  # minAvailable: 1
  maxUnavailable: 1
