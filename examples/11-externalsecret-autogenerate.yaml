# Auto-generate a missing Vaultwarden item on first ESO reconcile.
#
# Requires chart values:
#   provisioning.autoGenerate.enabled: true
#   rbac.create: true
#   serviceAccount.create: true
#
# The bridge lists ExternalSecrets, and only creates a Vaultwarden item when
# this annotation is "true" AND the item is missing. Existing fields are never
# overwritten.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-app-generated
  namespace: default
  labels:
    app.kubernetes.io/part-of: secrets-platform
  annotations:
    vaultwarden.bridge/auto-generate: "true"
    vaultwarden.bridge/password-length: "32"
    # Optional comma-separated keys for bulk GET / dataFrom extract:
    # vaultwarden.bridge/generate-keys: "password,username"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vaultwarden-eso-bridge
    kind: ClusterSecretStore
  target:
    name: demo-app-generated
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: default/demo-app-generated
        property: password
