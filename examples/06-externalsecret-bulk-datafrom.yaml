# Bulk multi-key ExternalSecret sample using dataFrom.extract.
# Resolves all item properties in a single HTTP request to /v1/secret/{namespace}/{secret}.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-plex-bulk
  namespace: media
  labels:
    app.kubernetes.io/part-of: secrets-platform
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: vaultwarden-eso-bridge
    kind: ClusterSecretStore
  target:
    name: plex-credentials-bulk
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: media/plex
