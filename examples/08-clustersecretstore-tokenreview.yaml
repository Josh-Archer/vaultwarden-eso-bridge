# Zero-shared-secret ClusterSecretStore using Kubernetes ServiceAccount TokenReview authentication.
# ESO sends its own ServiceAccount token in the Authorization header; the bridge validates it
# against the Kubernetes TokenReview API with zero shared secrets.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vaultwarden-eso-bridge-tokenreview
  labels:
    app.kubernetes.io/name: vaultwarden-eso-bridge
    app.kubernetes.io/part-of: secrets-platform
spec:
  provider:
    webhook:
      # Bridge single-key endpoint:
      #   GET /v1/secret/{namespace}/{secret}/{key}
      url: "http://vaultwarden-eso-bridge.secrets-platform.svc.cluster.local:8080/v1/secret/{{ .remoteRef.key }}/{{ .remoteRef.property }}"
      method: GET
      timeout: 10s
      result:
        jsonPath: "$.value"
      headers:
        Content-Type: application/json
        Authorization: "Bearer {{ .auth.token }}"
      # In TokenReview mode, ESO projects its own ServiceAccount token into .auth.token
      # rather than requiring a static shared Secret.
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
