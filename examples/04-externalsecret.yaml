# Sample ExternalSecret that syncs one key from the bridge into a Kubernetes Secret.
#
# Mapping:
#   remoteRef.key      = Vaultwarden item path (default template: {namespace}/{secret})
#   remoteRef.property = field / custom field name on that item
#
# Mock mode (values-mock.yaml) ships a matching entry for default/demo-app.
# For bw-cli, create a Vaultwarden item named "default/demo-app" with a
# custom field (or login field) named "password".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-app-credentials
  namespace: default
  labels:
    app.kubernetes.io/part-of: secrets-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vaultwarden-eso-bridge
    kind: ClusterSecretStore
  target:
    name: demo-app-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: default/demo-app
        property: password
    # Optional second field (custom field or login.username):
    # - secretKey: username
    #   remoteRef:
    #     key: default/demo-app
    #     property: username
