name: Release Please

on:
  push:
    branches:
      - main

# Writes go through the GitHub App installation token, not GITHUB_TOKEN
# and not a personal access token. contents: read is enough for this workflow.
permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    # Same runner selection as the other workflows. The zero-job tests runs
    # (41305303934, 40231642645) were not a runs-on parse failure: the
    # annotation was "This workflow run required approval but was not approved
    # before it expired" on pull_request events opened by app/github-actions.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'uecb-shared' }}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # App installation must be this repository only.
      # Secrets (Actions secrets on Josh-Archer/vaultwarden-eso-bridge):
      #   RELEASE_PLEASE_APP_CLIENT_ID     GitHub App client ID
      #   RELEASE_PLEASE_APP_PRIVATE_KEY   PEM private key for that app
      # App permissions: Contents write, Pull requests write. Nothing else.
      # Do not fall back to RELEASE_PLEASE_TOKEN or any Josh-Archer PAT.
      # The App user opens the release PR, so pull_request workflows are not
      # held for first-time-contributor approval.
      - name: Require GitHub App credentials
        env:
          RELEASE_PLEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_PLEASE_APP_CLIENT_ID}" ] || [ -z "${RELEASE_PLEASE_APP_PRIVATE_KEY}" ]; then
            echo "::error::Set RELEASE_PLEASE_APP_CLIENT_ID and RELEASE_PLEASE_APP_PRIVATE_KEY (GitHub App, Contents and Pull requests write, installed on this repo only). There is no PAT fallback."
            exit 1
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: vaultwarden-eso-bridge
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f # v4.1.3
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  # Same-repo reusable workflow. A failed publish fails this run via needs.
  # No gh CLI and no actions: write. Tag-push publish is not used, because
  # a release-token tag push would otherwise publish a second time.
  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-chart.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
