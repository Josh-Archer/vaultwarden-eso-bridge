# BRIDGE_TOKEN for the Helm chart (auth.existingSecret / auth.tokenKey)
# and for the ClusterSecretStore webhook Authorization header.
#
# Replace the token value before apply. Prefer sealed-secrets / SOPS / ESO
# generators in real environments — this plain Secret is for local demos.
apiVersion: v1
kind: Secret
metadata:
  name: eso-bridge-auth
  namespace: secrets-platform
  labels:
    app.kubernetes.io/name: vaultwarden-eso-bridge
    app.kubernetes.io/part-of: secrets-platform
    # Required so ESO webhook provider may read this credential.
    external-secrets.io/type: webhook
type: Opaque
stringData:
  token: "replace-with-long-random-bridge-token"
