apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden-eso-bridge
  labels:
    app.kubernetes.io/name: vaultwarden-eso-bridge
    app.kubernetes.io/part-of: secrets-platform
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden-eso-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultwarden-eso-bridge
    spec:
      serviceAccountName: {{ default "vaultwarden-eso-bridge" .Values.serviceAccount.name }}
      containers:
        - name: bridge
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "/app/bridge_server.py"]
          env:
            - name: BRIDGE_PORT
              value: "{{ .Values.service.port }}"
          {{- if or (ne .Values.auth.mode "tokenReview") .Values.auth.existingSecret }}
          {{- if .Values.auth.existingSecret }}
            - name: BRIDGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.tokenKey }}
          {{- end }}
          {{- end }}
          {{- if or .Values.auth.tokenReview.enabled (eq .Values.auth.mode "tokenReview") (eq .Values.auth.mode "dual") }}
            - name: TOKENREVIEW_ENABLED
              value: "true"
            - name: ALLOWED_SERVICE_ACCOUNTS
              value: {{ join "," .Values.auth.tokenReview.allowedServiceAccounts | quote }}
            - name: TOKENREVIEW_CACHE_TTL_SECONDS
              value: "{{ .Values.auth.tokenReview.cacheTtlSeconds | default 300 }}"
          {{- if .Values.auth.tokenReview.audiences }}
            - name: TOKENREVIEW_AUDIENCES
              value: {{ join "," .Values.auth.tokenReview.audiences | quote }}
          {{- end }}
          {{- end }}
          {{- if .Values.tls.enabled }}
            - name: TLS_ENABLED
              value: "true"
            - name: TLS_CERT_PATH
              value: {{ .Values.tls.certPath | default "/etc/tls/tls.crt" | quote }}
            - name: TLS_KEY_PATH
              value: {{ .Values.tls.keyPath | default "/etc/tls/tls.key" | quote }}
          {{- end }}
          {{- if and .Values.websocketSync .Values.websocketSync.enabled }}
            - name: WEBSOCKET_SYNC_ENABLED
              value: "true"
          {{- if .Values.websocketSync.url }}
            - name: VAULTWARDEN_WS_URL
              value: {{ .Values.websocketSync.url | quote }}
          {{- end }}
            - name: WEBSOCKET_RECONNECT_INTERVAL_SECONDS
              value: "{{ .Values.websocketSync.reconnectIntervalSeconds | default 5 }}"
            - name: WEBSOCKET_SSL_VERIFY
              value: "{{ .Values.websocketSync.sslVerify }}"
          {{- end }}
            - name: BRIDGE_TOKEN_LEGACY_VARIANTS
              value: "{{ .Values.auth.legacyTokenVariants }}"
            - name: BACKEND_MODE
              value: "{{ .Values.backend.mode }}"
            - name: ITEM_NAME_TEMPLATE
              value: "{{ .Values.backend.itemNameTemplate }}"
            - name: VAULTWARDEN_SERVER
              value: "{{ .Values.backend.vaultwarden.server }}"
            - name: VAULTWARDEN_ORGANIZATION_ID
              value: "{{ .Values.backend.vaultwarden.organizationId }}"
            - name: VAULTWARDEN_FOLDER
              value: "{{ .Values.backend.vaultwarden.folderName }}"
          {{- if eq .Values.backend.mode "mock" }}
            - name: MOCK_SECRETS_JSON
              value: {{ .Values.backend.mockSecrets | toJson | quote }}
          {{- end }}
          {{- if .Values.backend.bwCli.enabled }}
            - name: BW_SERVER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.bwCli.existingSecret }}
                  key: {{ .Values.backend.bwCli.serverKey }}
                  optional: true
            - name: BW_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.bwCli.existingSecret }}
                  key: {{ .Values.backend.bwCli.emailKey }}
            - name: BW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.bwCli.existingSecret }}
                  key: {{ .Values.backend.bwCli.passwordKey }}
          {{- if .Values.backend.bwCli.sessionKey }}
            - name: BW_SESSION
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.bwCli.existingSecret }}
                  key: {{ .Values.backend.bwCli.sessionKey }}
                  optional: true
          {{- end }}
            - name: BW_ITEM_CACHE_TTL_SECONDS
              value: "{{ .Values.backend.bwCli.itemCacheTtlSeconds }}"
            - name: BW_NEGATIVE_CACHE_TTL_SECONDS
              value: "{{ .Values.backend.bwCli.negativeCacheTtlSeconds | default 15 }}"
            - name: BW_COMMAND_TIMEOUT_SECONDS
              value: "{{ .Values.backend.bwCli.commandTimeoutSeconds }}"
          {{- end }}
          {{- if or (eq .Values.backend.mode "bws") .Values.backend.bws.enabled }}
          {{- if .Values.backend.bws.existingSecret }}
            - name: BWS_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.bws.existingSecret }}
                  key: {{ .Values.backend.bws.accessTokenKey | default "BWS_ACCESS_TOKEN" }}
          {{- end }}
          {{- if .Values.backend.bws.serverUrl }}
            - name: BWS_SERVER_URL
              value: {{ .Values.backend.bws.serverUrl | quote }}
          {{- end }}
          {{- if .Values.backend.bws.projectId }}
            - name: BWS_PROJECT_ID
              value: {{ .Values.backend.bws.projectId | quote }}
          {{- end }}
            - name: BWS_ITEM_CACHE_TTL_SECONDS
              value: "{{ .Values.backend.bws.itemCacheTtlSeconds | default 120 }}"
            - name: BWS_NEGATIVE_CACHE_TTL_SECONDS
              value: "{{ .Values.backend.bws.negativeCacheTtlSeconds | default 15 }}"
            - name: BWS_COMMAND_TIMEOUT_SECONDS
              value: "{{ .Values.backend.bws.commandTimeoutSeconds | default 60 }}"
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if and .Values.backend.bwCli.enabled .Values.backend.bwCli.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.backend.bwCli.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.backend.bwCli.startupProbe.failureThreshold }}
          {{- end }}
          # Liveness stays on /healthz so a dead bw session does not restart-loop.
          # Readiness uses /readyz and fails when the bw-cli session is invalid,
          # removing the pod from Service endpoints so ESO stops calling it.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds | default (ternary 45 5 .Values.backend.bwCli.enabled) }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds | default (ternary 90 10 .Values.backend.bwCli.enabled) }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          volumeMounts:
            - name: bridge-script
              mountPath: /app
              readOnly: true
          {{- if and .Values.tls.enabled .Values.tls.existingSecret }}
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
          {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: bridge-script
          configMap:
            name: vaultwarden-eso-bridge-script
            defaultMode: 0555
      {{- if and .Values.tls.enabled .Values.tls.existingSecret }}
        - name: tls-certs
          secret:
            secretName: {{ .Values.tls.existingSecret }}
      {{- end }}
