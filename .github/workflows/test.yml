name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Also run the optional Vaultwarden docker-compose integration test"
        type: boolean
        default: false

jobs:
  unit:
    name: unit (mock backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bridge unit tests
        run: bash scripts/test-eso-bridge-unit.sh

  integration:
    name: integration (real Vaultwarden)
    # Optional path: mock/unit stays the default CI gate.
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cryptography (cert generation)
        run: python -m pip install -q cryptography

      - name: Run Vaultwarden integration test
        run: bash scripts/test-eso-bridge-integration.sh
