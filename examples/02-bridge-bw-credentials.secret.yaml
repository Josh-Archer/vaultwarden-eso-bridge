# Vaultwarden / Bitwarden CLI credentials for backend.mode=bw-cli.
# Only required when using values-bw-cli.yaml (or equivalent chart values).
#
# Keys match chart defaults:
#   backend.bwCli.existingSecret: eso-bridge-bw
#   serverKey / emailKey / passwordKey / optional sessionKey
apiVersion: v1
kind: Secret
metadata:
  name: eso-bridge-bw
  namespace: secrets-platform
  labels:
    app.kubernetes.io/name: vaultwarden-eso-bridge
    app.kubernetes.io/part-of: secrets-platform
type: Opaque
stringData:
  BW_SERVER: "https://vaultwarden.example.com"
  BW_EMAIL: "eso-bridge@example.com"
  BW_PASSWORD: "replace-with-vaultwarden-password"
  # Optional pre-seeded session; leave empty to let the bridge unlock/login.
  # BW_SESSION: ""
