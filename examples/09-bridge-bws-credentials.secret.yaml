apiVersion: v1
kind: Secret
metadata:
  name: eso-bridge-bws
  namespace: external-secrets
type: Opaque
stringData:
  # Machine account access token generated in Bitwarden Secrets Manager (BWS).
  # No master password, email, or interactive 2FA is required.
  BWS_ACCESS_TOKEN: "<example-only-bws-machine-access-token>"
