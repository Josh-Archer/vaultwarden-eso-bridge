# Multi-key ExternalSecret sample for login-style Vaultwarden items.
# Useful when the item has login.username / login.password (or short aliases
# username / password) plus custom fields.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-plex
  namespace: media
  labels:
    app.kubernetes.io/part-of: secrets-platform
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: vaultwarden-eso-bridge
    kind: ClusterSecretStore
  target:
    name: plex-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: media/plex
        property: username
    - secretKey: password
      remoteRef:
        key: media/plex
        property: password
    - secretKey: token
      remoteRef:
        key: media/plex
        property: token
