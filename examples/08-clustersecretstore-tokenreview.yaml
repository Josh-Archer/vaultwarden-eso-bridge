# Header shape the bridge accepts for TokenReview (a ServiceAccount bearer token).
# The supported store is examples/03-clustersecretstore.yaml: a Secret labeled
# external-secrets.io/type: webhook. Upstream ESO releases in docs/compatibility.md
# do not define webhook.serviceAccountRef, so the apiserver drops the field below.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vaultwarden-eso-bridge-tokenreview
  labels:
    app.kubernetes.io/name: vaultwarden-eso-bridge
    app.kubernetes.io/part-of: secrets-platform
spec:
  provider:
    webhook:
      # Bridge single-key endpoint:
      #   GET /v1/secret/{namespace}/{secret}/{key}
      url: "http://vaultwarden-eso-bridge.secrets-platform.svc.cluster.local:8080/v1/secret/{{ .remoteRef.key }}/{{ .remoteRef.property }}"
      method: GET
      timeout: 10s
      result:
        jsonPath: "$.value"
      headers:
        Content-Type: application/json
        Authorization: "Bearer {{ .auth.token }}"
      # Outside the webhook schema on the ESO releases in docs/compatibility.md.
      # Kept so the intended header shape stays visible. The apiserver drops it.
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
