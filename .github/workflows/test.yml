name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Also run the optional Vaultwarden docker-compose integration test"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    name: unit (mock backend)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'uecb-shared' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run bridge unit tests
        run: bash scripts/test-eso-bridge-unit.sh

  compat:
    name: compatibility matrix
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'uecb-shared' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Check ESO and bw CLI compatibility matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-compat-matrix.sh

  # Check name on pull requests is `chart`. Not a required status check;
  # add that ruleset entry only after this job is green on main.
  chart:
    name: chart
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'uecb-shared' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.1

      - name: Lint and render chart
        run: bash scripts/lint-chart.sh

  security:
    name: bw CLI and image vulnerability gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan bw CLI production lockfile
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: bw-cli/package-lock.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          cache: 'false'

      - name: Build bridge image locally
        run: docker build --tag eso-bridge-security:local .

      - name: Scan built bridge image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: 'true'
          scan-type: image
          image-ref: eso-bridge-security:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          cache: 'false'

  integration:
    name: integration (real Vaultwarden)
    # Optional path: mock/unit stays the default CI gate.
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'uecb-shared' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install cryptography (cert generation)
        run: python -m pip install -q cryptography

      - name: Run Vaultwarden integration test
        run: bash scripts/test-eso-bridge-integration.sh
