# Cluster-scoped store that points ESO at the bridge webhook.
# Adjust service DNS if the chart is installed in a different namespace/port.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vaultwarden-eso-bridge
  labels:
    app.kubernetes.io/name: vaultwarden-eso-bridge
    app.kubernetes.io/part-of: secrets-platform
spec:
  provider:
    webhook:
      # Bridge contract:
      #   GET /v1/secret/{namespace}/{secret}/{key}
      # remoteRef.key    -> "{namespace}/{secret}" (URL-encoded by ESO templating as needed)
      # remoteRef.property -> key / field name on the Vaultwarden item (or mock map)
      url: "http://vaultwarden-eso-bridge.secrets-platform.svc.cluster.local:8080/v1/secret/{{ .remoteRef.key }}/{{ .remoteRef.property }}"
      method: GET
      timeout: 10s
      result:
        jsonPath: "$.value"
      headers:
        Content-Type: application/json
        Authorization: "Bearer {{ .auth.token }}"
      secrets:
        - name: auth
          secretRef:
            name: eso-bridge-auth
            namespace: secrets-platform
            # Entire secret is exposed as .auth.<key>
            # Chart default token key is "token".
