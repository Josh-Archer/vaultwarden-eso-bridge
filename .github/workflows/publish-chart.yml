name: Publish Helm Chart

on:
  push:
    tags:
      - "vaultwarden-eso-bridge-v*"
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional semver override (for example 0.1.2)"
        required: false
        type: string
      dry_run:
        description: "Package/lint only; skip GHCR push"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ${{ (vars.USE_SELF_HOSTED == 'true' || vars.USE_SELF_HOSTED == true) && 'home-gh-runner' || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_repository: ${{ steps.meta.outputs.image_repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve publish arguments
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          VERSION_INPUT="${{ inputs.version || '' }}"
          DRY_RUN_INPUT="${{ inputs.dry_run || false }}"
          CHART_BASE_VERSION="$(awk '/^version:/ {print $2; exit}' chart/vaultwarden-eso-bridge/Chart.yaml)"
          RESOLVED_VERSION=""

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == vaultwarden-eso-bridge-v* ]]; then
            RESOLVED_VERSION="${GITHUB_REF_NAME#vaultwarden-eso-bridge-v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            RESOLVED_VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${VERSION_INPUT}" ]]; then
            RESOLVED_VERSION="${VERSION_INPUT#v}"
          else
            RESOLVED_VERSION="${CHART_BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}"
          fi

          IMAGE_TAG="${RESOLVED_VERSION}"
          IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"

          {
            echo "version=${RESOLVED_VERSION}"
            echo "dry_run=${DRY_RUN_INPUT}"
            echo "image_tag=${IMAGE_TAG}"
            echo "image_repository=${IMAGE_REPOSITORY}"
          } >> "${GITHUB_OUTPUT}"

  publish-image:
    runs-on: ${{ (vars.USE_SELF_HOSTED == 'true' || vars.USE_SELF_HOSTED == true) && 'home-gh-runner' || 'ubuntu-latest' }}
    needs: prepare
    env:
      GHCR_USERNAME: ${{ github.actor }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ needs.prepare.outputs.dry_run != 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.dry_run != 'true' }}
          tags: ${{ needs.prepare.outputs.image_repository }}:${{ needs.prepare.outputs.image_tag }}
          build-args: |
            BW_CLI_VERSION=2025.12.0
          provenance: false

  publish:
    runs-on: ${{ (vars.USE_SELF_HOSTED == 'true' || vars.USE_SELF_HOSTED == true) && 'home-gh-runner' || 'ubuntu-latest' }}
    needs:
      - prepare
      - publish-image
    env:
      GHCR_USERNAME: ${{ github.actor }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Publish chart
        shell: bash
        env:
          GHCR_REPOSITORY: ${{ vars.GHCR_REPOSITORY }}
          GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Default to publishing under the current repository so GITHUB_TOKEN
          # has write access. Allow repository-level override via GHCR_REPOSITORY var.
          if [[ -z "${GHCR_REPOSITORY:-}" ]]; then
            GHCR_REPOSITORY="${GITHUB_REPOSITORY}"
          fi
          GHCR_REPOSITORY="${GHCR_REPOSITORY,,}"

          # Prefer a dedicated PAT when configured; otherwise use workflow token.
          if [[ -n "${GHCR_PUBLISH_TOKEN:-}" ]]; then
            GHCR_TOKEN="${GHCR_PUBLISH_TOKEN}"
          else
            GHCR_TOKEN="${GITHUB_TOKEN}"
          fi

          export GHCR_REPOSITORY
          export GHCR_TOKEN

          ARGS=()

          if [[ -n "${{ needs.prepare.outputs.version }}" ]]; then
            ARGS+=(--version "${{ needs.prepare.outputs.version }}")
            ARGS+=(--app-version "${{ needs.prepare.outputs.version }}")
          fi

          if [[ "${{ needs.prepare.outputs.dry_run }}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi

          bash ./scripts/publish-secrets-platform-bridge-chart.sh "${ARGS[@]}"
